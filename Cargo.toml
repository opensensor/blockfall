[workspace]
resolver = "2"
members = ["crates/tetris-core", "crates/tetris-app", "crates/netplay-gateway"]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["2d", "ui"] }
bevy_kira_audio = { version = "0.26.0", features = ["wav"] }
bincode = "1.3"
bevy_renet = "5.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
dirs = "7.0.0"
proptest = "1.11.0"
tetris-core = { path = "crates/tetris-core" }
netplay-gateway = { path = "crates/netplay-gateway" }

# Dependencies compile optimized even in dev builds (Bevy is heavy);
# workspace crates stay at opt-level 0 for fast incremental rebuilds.
[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 1
