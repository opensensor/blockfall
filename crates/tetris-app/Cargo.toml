[package]
name = "tetris-app"
description = "Bevy presentation layer for the Tetris-like game"
version.workspace = true
edition.workspace = true
license.workspace = true

# T21 (PRD §14 #1): user-visible binary name is `blockfall`; the package id
# stays `tetris-app` so `cargo run -p tetris-app` keeps working.
[[bin]]
name = "blockfall"
path = "src/main.rs"

# Android packaging: the app lives in this lib so cargo-ndk can build the
# `cdylib` (`libblockfall_app.so`) whose `android_main` (from `#[bevy_main]`)
# the `NativeActivity` in `android/AndroidManifest.xml` loads. Desktop keeps
# using the `blockfall` binary, which forwards to the same `main()`.
[lib]
name = "blockfall_app"
crate-type = ["cdylib", "rlib"]

[dependencies]
tetris-core = { workspace = true }
bevy = { workspace = true, features = ["serialize", "bevy_text", "default_font", "android-native-activity"] }
bevy_kira_audio = { workspace = true }
bevy_renet = { workspace = true }
bincode = { workspace = true }
netplay-gateway = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
